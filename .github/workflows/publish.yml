name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Publish npm packages
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspaces
      - run: npm test --workspaces
      - name: Publish @make-software/cspr-trade-mcp-sdk
        run: |
          NAME=$(node -p "require('./packages/sdk/package.json').name")
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            npm publish --workspace packages/sdk --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @make-software/cspr-trade-mcp
        run: |
          NAME=$(node -p "require('./packages/mcp/package.json').name")
          VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION already published — skipping"
          else
            npm publish --workspace packages/mcp --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish skill to ClawHub
  clawhub:
    runs-on: ubuntu-latest
    needs: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to ClawHub
        run: |
          npx clawhub@latest login --token ${{ secrets.CLAWHUB_TOKEN }} --no-browser
          npx clawhub@latest publish ./skill/cspr-trade \
            --slug cspr-trade-mcp \
            --name "CSPR.trade MCP" \
            --version ${{ github.ref_name }} \
            --tags latest \
            --changelog "Release ${{ github.ref_name }}" \
            --no-input
